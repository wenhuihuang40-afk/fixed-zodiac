            en: {
                title: 'Zodiac Buddies', subtitle: 'Enter two birthdays to discover your zodiac vibe',
                you: 'You', friend: 'Friend', partner: 'Partner', month: 'Birth month', day: 'Birth day',
                friendshipMode: 'Friendship', romanceMode: 'Romance',
                submit: 'Check zodiac & closeness', resultFriend: 'Your friendship vibe', resultLove: 'Your romantic closeness',
                scoreFriend: 'Friendship vibe', scoreLove: 'Romantic closeness',
                days: (n) => n + ' day' + (n === 1 ? '' : 's') + ' apart (calendar cycle)',
                errorEmpty: 'Please enter both birthdays.',
                errorInteger: 'Month and day must be whole numbers.',
                errorMonth: (name) => name + ': month must be from 1 to 12.',
                errorDate: (name, month, day) => name + ': ' + month + ' has no day ' + day + '.',
                perfectFriend: 'Your birthdays are close, like teammates from the same season! Shared little memories can make your bond even brighter.',
                closeFriend: 'Your birthdays sit near each other on the calendar, so your rhythms may feel familiar. Share the everyday moments and your friendship can grow naturally.',
                middleFriend: 'Your birthdays fall in different parts of the year, bringing distinct rhythms and perspectives. Curiosity about those differences can make your friendship more fun.',
                farFriend: 'Your birthdays are farther apart, like energy from different seasons. Patience and honest conversation can help you find a comfortable rhythm together.',
                perfectLove: 'Your birthdays are close, so your everyday rhythms may feel familiar. Keep surprising each other and make room for new experiences.',
                closeLove: 'You are close on the calendar and may find a shared rhythm quickly. Say what you appreciate and be honest about what you need.',
                middleLove: 'Your birthdays bring different rhythms and perspectives. Treat those differences as a way to keep learning about each other.',
                farLove: 'You may feel like energy from different seasons. Patience, honest conversation, and respect for space can help you find your rhythm.',
                disclaimer: 'This playful score uses birthday distance; it cannot measure a real relationship or personality.',
                signHeading: 'Zodiac snapshots', personality: 'Personality', habits: 'Everyday habits',
                mbti: 'MBTI for fun', mbtiNote: 'A zodiac-inspired guess, not an MBTI assessment.',
                pageTitle: 'Zodiac Buddies'
            }
        };

        function showError(message) {
            resultDiv.hidden = false;
            resultDiv.classList.add('error');
            resultDiv.textContent = message;
        }

        function calculateZodiac(month, day) {
            const rule = zodiacRules[month - 1];
            return day <= rule.endDay ? month - 1 : month % 12;
        }

        function getDayOfYear(month, day) {
            return Date.UTC(2024, month - 1, day) / 86400000;
        }

        function getBirthdayDistance(firstDate, secondDate) {
            const difference = Math.abs(getDayOfYear(...firstDate) - getDayOfYear(...secondDate));
            return Math.min(difference, 366 - difference);
        }

        function getCompatibility(distance) {
            return Math.round(100 - (distance / 183) * 60);
        }

        function interpretationFor(distance) {
            const copy = translations[language];
            const tier = distance <= 30 ? 'perfect' : distance <= 90 ? 'close' : distance <= 150 ? 'middle' : 'far';
            return copy[tier + (relationshipMode === 'romance' ? 'Love' : 'Friend')];
        }

        function applySelections() {
            const copy = translations[language];
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                let key = element.dataset.i18n;
                if (key === 'friend' && relationshipMode === 'romance') key = 'partner';
                element.textContent = copy[key];
            });
            languageButtons.forEach((button) => {
                button.setAttribute('aria-pressed', String(button.dataset.language === language));
            });
            modeButtons.forEach((button) => {
                button.setAttribute('aria-pressed', String(button.dataset.mode === relationshipMode));
            });
        }

        function setLanguage(nextLanguage) {
            language = nextLanguage;
            document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
            document.title = translations[language].pageTitle;
            applySelections();
            if (!resultDiv.hidden && !resultDiv.classList.contains('error')) {
                form.requestSubmit();
            } else if (resultDiv.classList.contains('error')) {
                resultDiv.hidden = true;
                resultDiv.classList.remove('error');
            }
        }

        function renderResult(signs, score, distance) {
            resultDiv.classList.remove('error');
            resultDiv.replaceChildren();
            resultDiv.hidden = false;

            const heading = document.createElement('h2');
            heading.className = 'result-heading';
            const copy = translations[language];
            heading.textContent = copy[relationshipMode === 'romance' ? 'resultLove' : 'resultFriend'];

            const pair = document.createElement('div');
            pair.className = 'zodiac-pair';
            signs.forEach((sign, index) => {
                const person = document.createElement('div');
                person.className = 'zodiac-person';
                const name = document.createElement('strong');
                name.textContent = copy[index === 0 ? 'you' : relationshipMode === 'romance' ? 'partner' : 'friend'];
                const zodiac = document.createElement('span');
                zodiac.textContent = zodiacNames[sign][language === 'zh' ? 0 : 1];
                person.append(name, zodiac);
                pair.append(person);
                if (index === 0) {
                    const mark = document.createElement('span');
                    mark.className = 'pair-mark';
                    mark.setAttribute('aria-hidden', 'true');
                    mark.textContent = '✦';
                    pair.append(mark);
                }
            });

            const scoreLine = document.createElement('div');
            scoreLine.className = 'score-line';
            const scoreLabel = document.createElement('span');
            scoreLabel.textContent = copy[relationshipMode === 'romance' ? 'scoreLove' : 'scoreFriend'];
            const scoreValue = document.createElement('strong');
            scoreValue.textContent = language === 'zh' ? score + '分' : score + '%';
            scoreLine.append(scoreLabel, scoreValue);

            const track = document.createElement('div');
            track.className = 'score-track';
            track.setAttribute('role', 'progressbar');
            track.setAttribute('aria-label', copy[relationshipMode === 'romance' ? 'scoreLove' : 'scoreFriend']);
            track.setAttribute('aria-valuemin', '0');
            track.setAttribute('aria-valuemax', '100');
            track.setAttribute('aria-valuenow', String(score));
            const fill = document.createElement('div');
            fill.className = 'score-fill';
            fill.style.width = score + '%';
            track.append(fill);

            const interpretation = document.createElement('p');
            interpretation.className = 'interpretation';
            interpretation.textContent = interpretationFor(distance);
            const dateDistance = document.createElement('p');
            dateDistance.className = 'date-distance';
            dateDistance.textContent = translations[language].days(distance);
            const notesHeading = document.createElement('h3');
            notesHeading.className = 'result-heading';
            notesHeading.style.marginTop = '20px';
            notesHeading.textContent = copy.signHeading;
            const notes = document.createElement('div');
            notes.className = 'sign-notes';
            signs.forEach((sign, index) => {
                const note = document.createElement('p');
                note.className = 'sign-note';
                const signName = document.createElement('strong');
                signName.textContent = copy[index === 0 ? 'you' : relationshipMode === 'romance' ? 'partner' : 'friend'] + ' · ' + zodiacNames[sign][language === 'zh' ? 0 : 1];
                note.append(signName);
                [
                    [copy.personality, signProfiles[sign][0][language === 'zh' ? 0 : 1]],
                    [copy.habits, signProfiles[sign][1][language === 'zh' ? 0 : 1]],
                    [copy.mbti, signProfiles[sign][2][language === 'zh' ? 0 : 1]]
                ].forEach(([label, value]) => {
                    const section = document.createElement('span');
                    section.className = 'profile-section';
                    const category = document.createElement('span');
                    category.className = 'profile-label';
                    category.textContent = label;
                    const detail = document.createElement('span');
                    detail.className = 'profile-copy';
                    detail.textContent = value;
                    section.append(category, detail);
                    note.append(section);
                });
                const mbtiNote = document.createElement('span');
                mbtiNote.className = 'mbti-note';
                mbtiNote.textContent = copy.mbtiNote;
                note.append(mbtiNote);
                notes.append(note);
            });
            const disclaimer = document.createElement('p');
            disclaimer.className = 'disclaimer';
            disclaimer.textContent = translations[language].disclaimer;
            resultDiv.append(heading, pair, scoreLine, track, dateDistance, interpretation, notesHeading, notes, disclaimer);
        }

        languageButtons.forEach((button) => {
            button.addEventListener('click', () => setLanguage(button.dataset.language));
        });
        modeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                relationshipMode = button.dataset.mode;
                applySelections();
                if (!resultDiv.hidden && !resultDiv.classList.contains('error')) form.requestSubmit();
            });
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const signs = [];
            for (const person of people) {
                const monthText = person.monthInput.value.trim();
                const dayText = person.dayInput.value.trim();

                if (monthText === '' || dayText === '') {
                    showError(translations[language].errorEmpty);
                    return;
                }

                const month = Number(monthText);
                const day = Number(dayText);
                if (!Number.isInteger(month) || !Number.isInteger(day)) {
                    showError(translations[language].errorInteger);
                    return;
                }
                if (month < 1 || month > 12) {
                    showError(translations[language].errorMonth(translations[language][people.indexOf(person) === 0 ? 'you' : 'friend']));
                    return;
                }
                if (day < 1 || day > maxDays[month - 1]) {
                    showError(translations[language].errorDate(translations[language][people.indexOf(person) === 0 ? 'you' : 'friend'], month, day));
                    return;
                }
                signs.push(calculateZodiac(month, day));
            }

            const dates = people.map((person) => [Number(person.monthInput.value), Number(person.dayInput.value)]);
            const distance = getBirthdayDistance(dates[0], dates[1]);
            const score = getCompatibility(distance);
            renderResult(signs, score, distance);
        });
    </script>
</body>
</html>
